<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SteVenJr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f8f9fa; }
        .card-header-custom { background-color: #fff; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-calendar-check"></i> Admin Panel SteVenJr</span>
            <button id="btn-logout" class="btn btn-danger btn-sm">Logout <i class="bi bi-box-arrow-right"></i></button>
        </div>
    </nav>

    <div class="container">
        
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="fw-bold mb-0">Mode UTS/UAS</h5>
                    <small class="text-muted">Tampilkan menu UTS di web utama?</small>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="toggle-mode-uts" style="width: 3em; height: 1.5em;">
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white fw-bold">Tambah Jadwal Baru</div>
            <div class="card-body">
                <form id="form-tambah">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nama Kegiatan / Matkul</label>
                            <input type="text" id="input-matkul" class="form-control" required placeholder="Contoh: Pemrograman Lanjut">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Kategori</label>
                            <select id="input-kategori" class="form-select">
                                <option value="kuliah">Kuliah Harian</option>
                                <option value="uts">UTS / UAS</option>
                                <option value="personal">Personal</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Hari</label>
                            <select id="input-hari" class="form-select">
                                <option value="Senin">Senin</option>
                                <option value="Selasa">Selasa</option>
                                <option value="Rabu">Rabu</option>
                                <option value="Kamis">Kamis</option>
                                <option value="Jumat">Jumat</option>
                                <option value="Sabtu">Sabtu</option>
                                <option value="Minggu">Minggu</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Jam Mulai</label>
                            <input type="time" id="input-mulai" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Jam Selesai</label>
                            <input type="time" id="input-selesai" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ruangan / Detail</label>
                            <input type="text" id="input-ruangan" class="form-control" placeholder="Contoh: Lab 1 / Online">
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-success"><i class="bi bi-plus-lg"></i> Simpan Jadwal</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <ul class="nav nav-tabs card-header-tabs">
                    <li class="nav-item">
                        <button class="nav-link active fw-bold" id="tab-kuliah" onclick="gantiTab('kuliah')">
                            <i class="bi bi-book"></i> Kuliah
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link fw-bold text-muted" id="tab-uts" onclick="gantiTab('uts')">
                            <i class="bi bi-file-text"></i> UTS / UAS
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link fw-bold text-muted" id="tab-personal" onclick="gantiTab('personal')">
                            <i class="bi bi-person"></i> Personal
                        </button>
                    </li>
                </ul>
            </div>
            <div class="card-body">
                <div id="list-jadwal">
                    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
