<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteVenJr OS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4f46e5' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .widget-scroll::-webkit-scrollbar { width: 4px; }
        .widget-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center py-10 relative">

    <div id="db-error-banner" class="hidden w-full bg-red-500 text-white text-center py-3 font-bold text-xs fixed top-0 z-[9999] shadow-lg animate-pulse">
        <i class="fas fa-exclamation-triangle mr-2"></i> KONEKSI DATABASE GAGAL! PERIKSA FILE API.
    </div>

    <div class="absolute top-5 right-5 z-50">
        <a href="admin.html" class="block w-12 h-12 rounded-full bg-white hover:bg-indigo-50 text-indigo-600 transition shadow-lg flex items-center justify-center border border-indigo-100 group">
            <i class="fas fa-fingerprint text-xl group-hover:scale-110 transition"></i>
        </a>
    </div>

    <div id="main-dashboard" class="w-[95%] max-w-md transition-all duration-300 mt-5">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-indigo-900 tracking-tight mb-1">SteVenJr <span class="text-indigo-500">OS</span></h1>
            <p class="text-xs text-gray-400 font-medium mb-8">Personal Life Assistant</p>
            
            <div class="bg-white rounded-[2rem] p-8 shadow-xl border border-indigo-50 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 to-purple-500 group-hover:h-2 transition-all"></div>
                <p id="current-date" class="text-indigo-400 font-bold uppercase tracking-widest text-[10px] mb-2">...</p>
                <div id="digital-clock" class="text-5xl font-black text-gray-800 tracking-tighter">00.00.00</div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-6 mb-8 text-white shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-5"><i class="fas fa-bolt text-6xl"></i></div>
            <div class="flex justify-between items-center mb-4 relative z-10">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fas fa-chart-line text-yellow-400 mr-2"></i>Daily Load</span>
                <span id="energy-level" class="text-2xl font-black text-white">0%</span>
            </div>
            <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden relative z-10">
                <div id="energy-bar" class="h-full bg-indigo-500 transition-all duration-1000 shadow-[0_0_10px_rgba(99,102,241,0.5)]" style="width: 0%"></div>
            </div>
            <p class="text-[10px] text-slate-400 mt-3 text-center italic opacity-80" id="busy-advice">"Menghitung jadwal..."</p>
        </div>

        <div class="grid grid-cols-1 gap-4 mb-8">
            <div id="exam-buttons-container" class="flex gap-3 hidden animate-fade-in-up">
                <button id="btn-menu-uts" onclick="switchView('uts')" class="hidden flex-1 bg-gradient-to-r from-orange-400 to-orange-500 text-white py-4 rounded-2xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm shadow-orange-200"><i class="fas fa-file-alt"></i> UTS</button>
                <button id="btn-menu-uas" onclick="switchView('uas')" class="hidden flex-1 bg-gradient-to-r from-purple-500 to-purple-600 text-white py-4 rounded-2xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm shadow-purple-200"><i class="fas fa-graduation-cap"></i> UAS</button>
            </div>
            <button onclick="switchView('daily')" class="bg-white text-indigo-700 border border-indigo-100 py-4 rounded-2xl font-bold hover:bg-indigo-50 hover:border-indigo-200 transition flex items-center justify-center gap-3 text-sm shadow-sm hover:shadow-md group">
                <i class="fas fa-university text-indigo-400 group-hover:scale-110 transition"></i> Jadwal Kuliah
            </button>
            <button onclick="switchView('personal')" class="bg-white text-gray-600 border border-gray-100 py-4 rounded-2xl font-bold hover:bg-gray-50 hover:border-gray-200 transition flex items-center justify-center gap-3 text-sm shadow-sm hover:shadow-md group">
                <i class="fas fa-user text-gray-400 group-hover:scale-110 transition"></i> Agenda Pribadi
            </button>
        </div>

        <div class="text-left">
            <h2 class="text-xs font-bold mb-4 text-gray-400 uppercase tracking-widest ml-2">Timeline Hari Ini</h2>
            <div id="today-schedule-container" class="space-y-4 min-h-[100px]">
                <p class="text-center text-gray-400 text-xs py-5">Memuat data...</p>
            </div>
        </div>
    </div>

    <div id="schedule-view" class="hidden w-[95%] max-w-4xl mt-5 pb-20 animate-fade-in-up">
        <header class="bg-white p-5 rounded-3xl shadow-sm flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border border-gray-100 sticky top-5 z-40">
            <div class="text-center md:text-left">
                <h1 class="text-xl font-bold text-gray-800">Daftar Jadwal</h1>
                <span id="page-category-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 inline-block uppercase mt-1">...</span>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeyup="searchSchedule()" placeholder="Cari..." class="pl-9 pr-4 py-2.5 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-100 w-full text-xs transition">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                </div>
                <button onclick="location.reload()" class="bg-gray-800 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-gray-900 transition text-xs shadow-lg"><i class="fas fa-times"></i></button>
            </div>
        </header>
        <div class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100"><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><tbody id="schedule-table-body" class="divide-y divide-gray-50 text-gray-600 text-sm"></tbody></table></div></div>
    </div>

    <script src="app.js"></script>
    <script>
        // LOGIC KHUSUS HTML INDEX
        function rowWidget(i, c) {
            let colors = { 'orange': 'border-orange-500 bg-orange-50/50 text-orange-900', 'purple': 'border-purple-500 bg-purple-50/50 text-purple-900', 'blue': 'border-indigo-500 bg-indigo-50/50 text-indigo-900', 'green': 'border-emerald-500 bg-emerald-50/50 text-emerald-900' }[c] || 'border-gray-500 bg-gray-50 text-gray-900';
            let detail = (c === 'green') ? (i.keterangan || 'Agenda Pribadi') : `${i.ruangan || 'TBD'} • ${i.kelas || '-'}`;
            let icon = (c === 'green') ? 'fa-user' : 'fa-book';
            return `<div class="relative pl-4 group"><div class="absolute left-0 top-0 bottom-0 w-1 bg-gray-100 rounded-full group-last:bottom-auto group-last:h-full"></div><div class="absolute left-[-3px] top-6 w-2.5 h-2.5 rounded-full border-2 border-white ${c === 'green' ? 'bg-emerald-400' : 'bg-indigo-400'} ring-2 ring-gray-100"></div><div class="${colors} border-l-0 p-4 rounded-2xl mb-3 shadow-sm relative overflow-hidden transition hover:-translate-y-1 hover:shadow-md"><div class="flex justify-between items-start relative z-10"><div><span class="text-[10px] font-bold uppercase tracking-widest opacity-60 mb-1 block">${i.type || i.label || 'KEGIATAN'}</span><h4 class="font-bold text-base leading-tight mb-1 text-gray-800">${i.matkul || i.nama_kegiatan || 'No Title'}</h4><p class="text-xs opacity-70 flex items-center gap-1"><i class="fas ${icon} text-[10px]"></i> ${detail}</p></div><div class="text-right"><div class="bg-white/60 backdrop-blur px-2 py-1 rounded-lg text-xs font-bold shadow-sm border border-white/20 whitespace-nowrap">${i.waktu}</div></div></div></div></div>`;
        }
        function switchView(type) { document.getElementById('main-dashboard').style.display = 'none'; document.getElementById('schedule-view').style.display = 'block'; window.scrollTo(0,0); if(window.loadScheduleData) window.loadScheduleData(type); }
        function searchSchedule() { const input = document.getElementById('searchInput').value.toLowerCase(); const rows = document.querySelectorAll('#schedule-table-body tr'); rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none'; }); }
    </script>
</body>
</html>
