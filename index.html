<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteVenJr OS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4f46e5' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .widget-scroll::-webkit-scrollbar { width: 4px; }
        .widget-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center py-10 relative">

    <div class="absolute top-5 right-5 z-50">
        <a href="admin.html" class="block w-12 h-12 rounded-full bg-white hover:bg-indigo-50 text-indigo-600 transition shadow-lg flex items-center justify-center border border-indigo-100 group">
            <i class="fas fa-fingerprint text-xl group-hover:scale-110 transition"></i>
        </a>
    </div>

    <div id="main-dashboard" class="w-[95%] max-w-md transition-all duration-300">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-indigo-900 tracking-tight mb-1">SteVenJr <span class="text-indigo-500">OS</span></h1>
            <p class="text-xs text-gray-400 font-medium mb-8">Personal Life Assistant</p>
            
            <div class="bg-white rounded-[2rem] p-8 shadow-xl border border-indigo-50 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 to-purple-500 group-hover:h-2 transition-all"></div>
                <p id="current-date" class="text-indigo-400 font-bold uppercase tracking-widest text-[10px] mb-2">...</p>
                <div id="digital-clock" class="text-5xl font-black text-gray-800 tracking-tighter">00.00.00</div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-6 mb-8 text-white shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-5"><i class="fas fa-bolt text-6xl"></i></div>
            <div class="flex justify-between items-center mb-4 relative z-10">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider"><i class="fas fa-chart-line text-yellow-400 mr-2"></i>Daily Load</span>
                <span id="energy-level" class="text-2xl font-black text-white">0%</span>
            </div>
            <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden relative z-10">
                <div id="energy-bar" class="h-full bg-indigo-500 transition-all duration-1000 shadow-[0_0_10px_rgba(99,102,241,0.5)]" style="width: 0%"></div>
            </div>
            <p class="text-[10px] text-slate-400 mt-3 text-center italic opacity-80" id="busy-advice">"Menghitung jadwal..."</p>
        </div>

        <div class="grid grid-cols-1 gap-4 mb-8">
            <div id="exam-buttons-container" class="flex gap-3 hidden animate-fade-in-up">
                <button id="btn-menu-uts" onclick="switchView('uts')" class="hidden flex-1 bg-gradient-to-r from-orange-400 to-orange-500 text-white py-4 rounded-2xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm shadow-orange-200">
                    <i class="fas fa-file-alt"></i> UTS
                </button>
                <button id="btn-menu-uas" onclick="switchView('uas')" class="hidden flex-1 bg-gradient-to-r from-purple-500 to-purple-600 text-white py-4 rounded-2xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm shadow-purple-200">
                    <i class="fas fa-graduation-cap"></i> UAS
                </button>
            </div>
            
            <button onclick="switchView('daily')" class="bg-white text-indigo-700 border border-indigo-100 py-4 rounded-2xl font-bold hover:bg-indigo-50 hover:border-indigo-200 transition flex items-center justify-center gap-3 text-sm shadow-sm hover:shadow-md group">
                <i class="fas fa-university text-indigo-400 group-hover:scale-110 transition"></i> Jadwal Kuliah
            </button>
            
            <button onclick="switchView('personal')" class="bg-white text-gray-600 border border-gray-100 py-4 rounded-2xl font-bold hover:bg-gray-50 hover:border-gray-200 transition flex items-center justify-center gap-3 text-sm shadow-sm hover:shadow-md group">
                <i class="fas fa-user text-gray-400 group-hover:scale-110 transition"></i> Agenda Pribadi
            </button>
        </div>

        <div class="text-left w-full pl-2">
            <h2 class="text-xs font-bold mb-6 text-gray-400 uppercase tracking-widest ml-1">Timeline Hari Ini</h2>
            <div id="today-schedule-container" class="space-y-0 min-h-[100px]">
                <p class="text-center text-gray-400 text-xs py-5">Memuat data...</p>
            </div>
        </div>
    </div>

    <div id="schedule-view" class="hidden w-[95%] max-w-4xl mt-5 pb-20 animate-fade-in-up">
        
        <div id="conflict-alert" class="hidden mb-6 mx-auto max-w-lg"></div>

        <header class="bg-white p-5 rounded-3xl shadow-sm flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border border-gray-100 sticky top-5 z-40">
            <div class="text-center md:text-left">
                <h1 class="text-xl font-bold text-gray-800">Daftar Jadwal</h1>
                <span id="page-category-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 inline-block uppercase mt-1">...</span>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto items-center">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeyup="searchSchedule()" placeholder="Cari..." class="pl-9 pr-4 py-2.5 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-100 w-full text-xs transition">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                </div>
                
                <button onclick="checkConflictsUI()" class="bg-yellow-100 text-yellow-700 hover:bg-yellow-200 px-4 py-2.5 rounded-xl font-bold transition text-xs shadow-sm flex items-center gap-2 whitespace-nowrap">
                    <i class="fas fa-exclamation-triangle"></i> Cek
                </button>

                <button onclick="location.reload()" class="bg-gray-800 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-gray-900 transition text-xs shadow-lg">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </header>

        <div class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <tbody id="schedule-table-body" class="divide-y divide-gray-50 text-gray-600 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

  <script src="app.js"></script>
    <script>
        // === 1. FUNGSI UTAMA LOAD SETTINGS (Wajib ada biar tombol muncul) ===
        async function loadSettingsAndMenu() {
            try {
                // Fetch status dari Firebase via API
                const response = await fetch('/api/settings');
                const data = await response.json();

                const utsBtn = document.getElementById('btn-menu-uts');
                const uasBtn = document.getElementById('btn-menu-uas');
                const container = document.getElementById('exam-buttons-container');

                // Reset state
                if (utsBtn) utsBtn.classList.add('hidden');
                if (uasBtn) uasBtn.classList.add('hidden');
                if (container) container.classList.add('hidden');

                // Tampilkan sesuai database
                if (data.show_uts || data.show_uas) {
                    if (container) {
                        container.classList.remove('hidden');
                        container.classList.add('flex');
                    }
                    if (data.show_uts && utsBtn) {
                        utsBtn.classList.remove('hidden');
                        utsBtn.classList.add('flex');
                    }
                    if (data.show_uas && uasBtn) {
                        uasBtn.classList.remove('hidden');
                        uasBtn.classList.add('flex');
                    }
                }
            } catch (error) {
                console.error("Gagal load settings:", error);
            }
        }

        // === 2. LOGIKA CEK BENTROK (Client Side Check) ===
        // Panggil fungsi ini sebelum me-looping data ke rowWidget di app.js kamu
        function markConflicts(scheduleData) {
            // Reset flag konflik dulu
            scheduleData.forEach(item => item.isConflict = false);

            for (let i = 0; i < scheduleData.length; i++) {
                for (let j = i + 1; j < scheduleData.length; j++) {
                    const itemA = scheduleData[i];
                    const itemB = scheduleData[j];

                    // Konversi waktu string "08:00" ke integer menit biar gampang dibandingin
                    const [startA, endA] = parseTimeRange(itemA.waktu);
                    const [startB, endB] = parseTimeRange(itemB.waktu);

                    // Rumus Cek Tabrakan Waktu
                    if (startA < endB && startB < endA) {
                        itemA.isConflict = true;
                        itemB.isConflict = true;
                    }
                }
            }
            return scheduleData;
        }

        // Helper: Ubah "08:00 - 10:00" jadi angka [480, 600]
        function parseTimeRange(timeStr) {
            if (!timeStr || !timeStr.includes('-')) return [0, 0];
            const parts = timeStr.split('-').map(t => t.trim());
            
            const toMinutes = (t) => {
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            };

            return [toMinutes(parts[0]), toMinutes(parts[1])];
        }

        // === 3. WIDGET TIMELINE (DENGAN VISUAL MERAH JIKA BENTROK) ===
        function rowWidget(i, c) {
            // Cek properti isConflict (harus di-set true jika bentrok)
            const isConflict = i.isConflict === true;

            // Logika Warna
            let colors, dotColor, iconColor;

            if (isConflict) {
                // TAMPILAN MERAH (BENTROK)
                colors = 'bg-red-50 text-red-900 border-red-300 ring-1 ring-red-200';
                dotColor = 'bg-red-600 animate-pulse shadow-[0_0_8px_rgba(220,38,38,0.6)]'; // Dot merah berkedip
                iconColor = 'text-red-500';
            } else {
                // TAMPILAN NORMAL
                colors = {
                    'orange': 'bg-orange-50 text-orange-900 border-orange-200',
                    'purple': 'bg-purple-50 text-purple-900 border-purple-200',
                    'blue':   'bg-indigo-50 text-indigo-900 border-indigo-200',
                    'green':  'bg-emerald-50 text-emerald-900 border-emerald-200'
                }[c] || 'bg-gray-50 text-gray-900 border-gray-200';

                dotColor = {
                    'orange': 'bg-orange-400',
                    'purple': 'bg-purple-400',
                    'blue':   'bg-indigo-400',
                    'green':  'bg-emerald-400'
                }[c] || 'bg-gray-400';
                
                iconColor = 'text-[10px]';
            }

            const detail = (c === 'green') ? (i.keterangan || '-') : `${i.ruangan || 'TBD'} • ${i.kelas || '-'}`;
            
            // Label peringatan jika bentrok
            const conflictLabel = isConflict ? `<span class="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded ml-2 font-bold uppercase tracking-wider"><i class="fas fa-exclamation-triangle"></i> BENTROK</span>` : '';

            return `
            <div class="relative pl-6 pb-8 group last:pb-0 border-l-2 ${isConflict ? 'border-red-200' : 'border-gray-100'} last:border-0 ml-2 transition-colors duration-300">
                <div class="absolute -left-[5px] top-0 w-2.5 h-2.5 rounded-full ring-4 ring-white ${dotColor}"></div>
                
                <div class="${colors} border p-4 rounded-2xl shadow-sm relative transition hover:-translate-y-1 hover:shadow-md">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center mb-1">
                                <span class="text-[10px] font-bold uppercase tracking-widest opacity-60 block">${i.label || 'KEGIATAN'}</span>
                                ${conflictLabel}
                            </div>
                            <h4 class="font-bold text-base leading-tight mb-1">${i.matkul || i.nama_kegiatan}</h4>
                            <p class="text-xs opacity-70 flex items-center gap-1"><i class="fas fa-map-marker-alt ${iconColor}"></i> ${detail}</p>
                        </div>
                        <div class="text-right">
                             <div class="bg-white/60 backdrop-blur px-2 py-1 rounded-lg text-xs font-bold shadow-sm border border-black/5 whitespace-nowrap ${isConflict ? 'text-red-700' : ''}">
                                ${i.waktu}
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function switchView(type) { 
            document.getElementById('main-dashboard').style.display = 'none'; 
            document.getElementById('schedule-view').style.display = 'block'; 
            window.scrollTo(0,0); 
            if(window.loadScheduleData) window.loadScheduleData(type); 
        }
        
        function searchSchedule() { 
            const input = document.getElementById('searchInput').value.toLowerCase(); 
            const rows = document.querySelectorAll('#schedule-table-body tr'); 
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none'; }); 
        }

        // Jalankan saat load
        document.addEventListener('DOMContentLoaded', loadSettingsAndMenu);
        // Listener tambahan jika localstorage berubah (opsional)
        window.addEventListener('storage', (event) => { if (event.key === 'show_uts' || event.key === 'show_uas') loadSettingsAndMenu(); });
    </script>
</body>
</html>
