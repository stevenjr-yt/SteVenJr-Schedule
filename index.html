<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteVenJr OS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4f46e5' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .widget-scroll::-webkit-scrollbar { width: 4px; }
        .widget-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center py-10 relative">

    <div class="absolute top-5 right-5 z-50">
        <a href="admin.html" class="block w-12 h-12 rounded-full bg-white hover:bg-indigo-50 text-indigo-600 transition shadow-lg flex items-center justify-center border border-indigo-100 group">
            <i class="fas fa-fingerprint text-xl group-hover:scale-110 transition"></i>
        </a>
    </div>

    <div id="main-dashboard" class="w-[95%] max-w-2xl transition-all duration-300">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-indigo-900 tracking-tight mb-1">SteVenJr <span class="text-indigo-500">OS</span></h1>
            <p class="text-xs text-gray-400 font-medium mb-8">Personal Life Assistant</p>
            
            <div class="bg-white rounded-[2rem] p-8 shadow-xl border border-indigo-50 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 to-purple-500 group-hover:h-2 transition-all"></div>
                <p id="current-date" class="text-indigo-400 font-bold uppercase tracking-widest text-[10px] mb-2">...</p>
                <div id="digital-clock" class="text-6xl font-black text-gray-800 tracking-tighter">00.00.00</div>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 mb-8 border border-gray-100 shadow-lg relative overflow-hidden">
            <div class="flex justify-between items-center mb-4 relative z-10">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider"><i class="fas fa-bolt text-yellow-400 mr-2"></i>Daily Load</span>
                <span id="energy-level" class="text-2xl font-black text-indigo-900">0%</span>
            </div>
            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden relative z-10">
                <div id="energy-bar" class="h-full bg-indigo-500 transition-all duration-1000 shadow-lg" style="width: 0%"></div>
            </div>
            <p class="text-[10px] text-gray-400 mt-3 text-center italic opacity-80" id="busy-advice">"Menghitung jadwal..."</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div id="exam-buttons-container" class="col-span-1 md:col-span-2 flex gap-3 hidden animate-fade-in-up">
                <button id="btn-menu-uts" onclick="switchView('uts')" class="hidden flex-1 bg-gradient-to-r from-orange-400 to-orange-500 text-white py-4 rounded-2xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm shadow-orange-200">
                    <i class="fas fa-file-alt"></i> UTS
                </button>
                <button id="btn-menu-uas" onclick="switchView('uas')" class="hidden flex-1 bg-gradient-to-r from-purple-500 to-purple-600 text-white py-4 rounded-2xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm shadow-purple-200">
                    <i class="fas fa-graduation-cap"></i> UAS
                </button>
            </div>
            
            <button onclick="switchView('daily')" class="bg-indigo-600 text-white border border-indigo-600 py-4 rounded-2xl font-bold hover:bg-indigo-700 transition flex items-center justify-center gap-3 text-sm shadow-lg shadow-indigo-200">
                <i class="fas fa-university"></i> Jadwal Kuliah
            </button>
            
            <button onclick="switchView('personal')" class="bg-white text-gray-600 border border-gray-100 py-4 rounded-2xl font-bold hover:bg-gray-50 hover:border-gray-200 transition flex items-center justify-center gap-3 text-sm shadow-sm">
                <i class="fas fa-user text-green-500"></i> Agenda Pribadi
            </button>
        </div>

        <div class="text-left w-full">
            <h2 class="text-sm font-bold mb-5 text-gray-800 flex items-center gap-2">
                <i class="fas fa-bell text-yellow-500"></i> Agenda Hari Ini
            </h2>
            <div id="today-schedule-container" class="space-y-4 min-h-[100px]">
                <p class="text-center text-gray-400 text-xs py-5">Memuat data...</p>
            </div>
        </div>
    </div>

    <div id="schedule-view" class="hidden w-[95%] max-w-4xl mt-5 pb-20 animate-fade-in-up">
        <header class="bg-white p-5 rounded-3xl shadow-sm flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border border-gray-100 sticky top-5 z-40">
            <div class="text-center md:text-left">
                <h1 class="text-xl font-bold text-gray-800">Daftar Jadwal</h1>
                <span id="page-category-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 inline-block uppercase mt-1">...</span>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeyup="searchSchedule()" placeholder="Cari..." class="pl-9 pr-4 py-2.5 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-100 w-full text-xs transition">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                </div>
                <button onclick="checkConflictsUI()" class="bg-yellow-100 text-yellow-700 px-4 py-2.5 rounded-xl font-bold hover:bg-yellow-200 transition text-xs shadow-lg flex items-center gap-2">
                    <i class="fas fa-exclamation-triangle"></i> Cek Bentrok
                </button>
                <button onclick="location.reload()" class="bg-gray-800 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-gray-900 transition text-xs shadow-lg">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </header>

        <div class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <tbody id="schedule-table-body" class="divide-y divide-gray-50 text-gray-600 text-sm"></tbody>
                </table>
            </div>
        </div>
        
        <p id="conflict-alert" class="hidden mt-6 px-6 py-4 rounded-xl relative text-center font-bold border-2 text-lg shadow-md transition-all"></p>
    </div>

    <script src="app.js"></script>
    <script>
        function rowWidget(i, c) {
            const colors = {
                'orange': 'border-orange-500 bg-orange-50 text-orange-900',
                'purple': 'border-purple-500 bg-purple-50 text-purple-900',
                'blue':   'border-blue-500 bg-blue-50 text-blue-900',
                'green':  'border-green-500 bg-green-50 text-green-900'
            }[c] || 'border-gray-500 bg-gray-50 text-gray-900';

            const detail = (c === 'green') ? (i.keterangan || '-') : `${i.ruangan || 'TBD'} • ${i.kelas || '-'}`;
            
            return `
            <div class="${colors} border-l-8 p-5 rounded-2xl mb-4 shadow-sm hover:shadow-md transition relative overflow-hidden group">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[10px] font-bold uppercase tracking-widest opacity-70 mb-1 block">${i.label || 'KEGIATAN'}</span>
                        <h4 class="font-extrabold text-lg leading-tight mb-1">${i.matkul || i.nama_kegiatan}</h4>
                        <p class="text-sm opacity-80 flex items-center gap-2"><i class="fas fa-map-marker-alt"></i> ${detail}</p>
                    </div>
                    <div class="bg-white/80 px-3 py-1 rounded-lg text-sm font-bold shadow-sm backdrop-blur-sm whitespace-nowrap">
                        ${i.waktu}
                    </div>
                </div>
            </div>`;
        }

        function switchView(type) {
            document.getElementById('main-dashboard').style.display = 'none';
            document.getElementById('schedule-view').style.display = 'block';
            window.scrollTo(0,0);
            if(window.loadScheduleData) window.loadScheduleData(type);
        }
        
        function searchSchedule() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#schedule-table-body tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
