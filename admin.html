<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SteVenJr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800">

    <div id="login-form" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 shadow-sm">
                    <i class="fas fa-user-shield text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">Admin Panel</h2>
                <p class="text-sm text-gray-400 mt-2">Verifikasi Realtime to SteVenJr Server</p>
            </div>
            
            <div class="space-y-5">
                <input type="email" id="email" placeholder="Email Address" class="w-full px-5 py-4 rounded-xl bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition text-center text-lg">
                <input type="password" id="password" placeholder="Password" class="w-full px-5 py-4 rounded-xl bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition text-center text-lg">
                <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">MASUK</button>
            </div>
            <p id="login-error" class="text-red-500 text-center mt-4 hidden font-medium"></p>
        </div>
    </div>

    <div id="admin-panel" class="hidden min-h-screen pb-20">
        <nav class="bg-white shadow-md px-8 py-5 mb-8 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-600 text-white p-3 rounded-xl shadow-blue-200 shadow-md"><i class="fas fa-calendar-alt text-xl"></i></div>
                    <div><h1 class="font-bold text-2xl leading-none text-gray-800">Admin Panel</h1><span class="text-sm text-gray-500">Kelola Jadwal SteVenJr</span></div>
                </div>
                <div class="flex gap-3">
                    <a href="index.html" target="_blank" class="bg-gray-100 text-gray-600 px-5 py-2.5 rounded-xl font-medium hover:bg-gray-200 transition flex items-center gap-2"><i class="fas fa-external-link-alt"></i> Web</a>
                    <button id="btn-logout" class="bg-red-50 text-red-600 px-5 py-2.5 rounded-xl font-medium hover:bg-red-100 transition flex items-center gap-2"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-5">
                    <div class="flex justify-between items-center pb-4 border-b border-dashed">
                        <div><h3 class="font-bold text-gray-800 text-lg">Mode UTS</h3><p class="text-xs text-gray-500">Tampilkan di Web?</p></div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-uts" class="sr-only peer"><div class="w-14 h-7 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-orange-500"></div></label>
                    </div>
                    <div class="flex justify-between items-center">
                        <div><h3 class="font-bold text-gray-800 text-lg">Mode UAS</h3><p class="text-xs text-gray-500">Tampilkan di Web?</p></div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-uas" class="sr-only peer"><div class="w-14 h-7 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-purple-600"></div></label>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-xl text-gray-800 mb-6 flex items-center gap-3"><i class="fas fa-plus-circle text-green-500"></i> Tambah Jadwal</h3>
                    
                    <form id="add-schedule-form" class="space-y-5">
                        
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Kategori</label>
                            <select id="kategori" class="w-full p-4 bg-gray-50 border-none rounded-xl text-gray-700 focus:ring-2 focus:ring-blue-500 transition font-medium" onchange="toggleFormFields()">
                                <option value="daily">Kuliah Harian</option>
                                <option value="uts">UTS</option>
                                <option value="uas">UAS</option>
                                <option value="personal">Pribadi (Personal)</option>
                            </select>
                        </div>

                        <div id="wrapper-frekuensi" class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                            <label class="text-xs font-bold text-blue-500 uppercase tracking-wide mb-2 block">Tipe Jadwal</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="frekuensi" value="routine" class="w-4 h-4 text-blue-600" checked onchange="toggleFormFields()">
                                    <span class="text-sm font-medium text-gray-700">Rutin (Mingguan)</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="frekuensi" value="once" class="w-4 h-4 text-blue-600" onchange="toggleFormFields()">
                                    <span class="text-sm font-medium text-gray-700">Tanggal Spesifik</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Nama Kegiatan / Matkul</label>
                            <input type="text" id="matkul" class="w-full p-4 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 transition" placeholder="Contoh: Algoritma" required>
                        </div>

                        <div id="field-hari">
                            <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Hari (Berulang)</label>
                            <select id="hari" class="w-full p-4 bg-gray-50 border-none rounded-xl text-gray-700">
                                <option value="Senin">Senin</option>
                                <option value="Selasa">Selasa</option>
                                <option value="Rabu">Rabu</option>
                                <option value="Kamis">Kamis</option>
                                <option value="Jumat">Jumat</option>
                                <option value="Sabtu">Sabtu</option>
                                <option value="Minggu">Minggu</option>
                            </select>
                        </div>

                        <div id="field-tanggal" class="hidden">
                            <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Tanggal Spesifik</label>
                            <input type="date" id="tanggal" class="w-full p-4 bg-gray-50 border-none rounded-xl text-gray-600 bg-yellow-50 border-yellow-100">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Waktu</label><input type="text" id="waktu" placeholder="08:00-10:00" class="w-full p-4 bg-gray-50 border-none rounded-xl" required></div>
                            <div><label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Ruangan</label><input type="text" id="ruangan" placeholder="F.4.2" class="w-full p-4 bg-gray-50 border-none rounded-xl"></div>
                        </div>

                        <div id="academic-fields" class="space-y-4 pt-4 border-t border-dashed">
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Kode MK</label><input type="text" id="kode" placeholder="KODE" class="w-full p-4 bg-gray-50 border-none rounded-xl"></div>
                                <div><label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Tipe</label><select id="tipe" class="w-full p-4 bg-gray-50 border-none rounded-xl"><option value="Teori">Teori</option><option value="Praktek">Praktek</option></select></div>
                            </div>
                            <div><label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Dosen</label><input type="text" id="dosen" placeholder="Nama Dosen" class="w-full p-4 bg-gray-50 border-none rounded-xl"></div>
                            <div><label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Kelas</label><input type="text" id="kelas" placeholder="3TI1" class="w-full p-4 bg-gray-50 border-none rounded-xl"></div>
                        </div>

                        <div id="personal-fields" class="hidden pt-4 border-t border-dashed">
                            <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Keterangan / Catatan</label>
                            <textarea id="keterangan" placeholder="Detail kegiatan..." class="w-full p-4 bg-gray-50 border-none rounded-xl" rows="2"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-green-200 transition mt-4">SIMPAN DATA</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-gray-800 text-xl">Database Jadwal</h3>
                        <span class="text-xs bg-blue-100 text-blue-600 px-3 py-1.5 rounded-full font-bold">Realtime</span>
                    </div>
                    <div class="flex space-x-3 border-b border-gray-200 mb-6 overflow-x-auto pb-2">
                        <button onclick="switchTab('list-daily', this)" class="tab-btn active px-5 py-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition whitespace-nowrap">HARIAN</button>
                        <button onclick="switchTab('list-uts', this)" class="tab-btn px-5 py-3 text-sm font-bold text-gray-500 hover:text-blue-600 border-b-2 border-transparent transition whitespace-nowrap">UTS</button>
                        <button onclick="switchTab('list-uas', this)" class="tab-btn px-5 py-3 text-sm font-bold text-gray-500 hover:text-blue-600 border-b-2 border-transparent transition whitespace-nowrap">UAS</button>
                        <button onclick="switchTab('list-personal', this)" class="tab-btn px-5 py-3 text-sm font-bold text-gray-500 hover:text-blue-600 border-b-2 border-transparent transition whitespace-nowrap">PERSONAL</button>
                    </div>
                    <div class="flex-grow relative min-h-[500px]">
                        <div id="list-daily" class="tab-content active h-full absolute inset-0 overflow-y-auto custom-scroll pr-3 space-y-3"></div>
                        <div id="list-uts" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll pr-3 space-y-3"></div>
                        <div id="list-uas" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll pr-3 space-y-3"></div>
                        <div id="list-personal" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll pr-3 space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script> 
    <script src="app.js"></script>
    
    <script>
        function toggleFormFields() {
            const cat = document.getElementById('kategori').value;
            const academicGroup = document.getElementById('academic-fields');
            const personalGroup = document.getElementById('personal-fields');
            
            // Elemen Frekuensi
            const wrapperFrekuensi = document.getElementById('wrapper-frekuensi');
            const radioRoutine = document.querySelector('input[value="routine"]');
            const radioOnce = document.querySelector('input[value="once"]');
            
            // Elemen Waktu
            const fieldHari = document.getElementById('field-hari');
            const fieldTanggal = document.getElementById('field-tanggal');
            const inputHari = document.getElementById('hari');
            const inputTanggal = document.getElementById('tanggal');

            // --- LOGIKA 1: Akademik vs Personal Fields ---
            if (cat === 'personal') {
                academicGroup.classList.add('hidden');
                personalGroup.classList.remove('hidden');
            } else {
                academicGroup.classList.remove('hidden');
                personalGroup.classList.add('hidden');
            }

            // --- LOGIKA 2: Frekuensi (Rutin vs Spesifik) ---
            
            // Jika UTS atau UAS -> HARUS Tanggal Spesifik
            if (cat === 'uts' || cat === 'uas') {
                // Sembunyikan pilihan frekuensi biar gak bingung, paksa ke 'once'
                wrapperFrekuensi.classList.add('hidden');
                radioOnce.checked = true;
                
                // Tampilkan input Tanggal, Sembunyikan Hari
                fieldHari.classList.add('hidden');
                fieldTanggal.classList.remove('hidden');
                
                // Bersihkan nilai Hari biar tidak terkirim ke DB (opsional)
                inputHari.value = ""; 
            } 
            // Jika Daily atau Personal -> User BISA PILIH
            else {
                wrapperFrekuensi.classList.remove('hidden');
                
                // Cek User pilih apa?
                if (radioRoutine.checked) {
                    // Mode Rutin: Tampilkan Hari
                    fieldHari.classList.remove('hidden');
                    fieldTanggal.classList.add('hidden');
                    inputTanggal.value = ""; // Reset tanggal
                    
                    // Default hari ke Senin kalau kosong
                    if(inputHari.value === "") inputHari.value = "Senin";
                } else {
                    // Mode Spesifik: Tampilkan Tanggal
                    fieldHari.classList.add('hidden');
                    fieldTanggal.classList.remove('hidden');
                    inputHari.value = ""; // Reset hari
                }
            }
        }

        // Jalankan saat load awal
        toggleFormFields();
    </script>
</body>
</html>
