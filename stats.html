<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Stats - SteVenJr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #0f172a; color: #e2e8f0; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">SYSTEM STATUS</h1>
            <p class="text-xs text-slate-500">Live Monitoring Dashboard</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div id="card-sb" class="bg-slate-800 border border-slate-700 rounded-xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition"><i class="fas fa-bolt text-6xl text-emerald-500"></i></div>
                <div class="flex items-center gap-3 mb-4">
                    <i class="fas fa-database text-emerald-400 text-xl"></i>
                    <h2 class="font-bold text-lg">SUPABASE (Main)</h2>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg">
                        <span class="text-xs text-slate-400">Status</span>
                        <span id="sb-status" class="text-xs font-bold px-2 py-1 rounded bg-slate-700 text-slate-300">CHECKING...</span>
                    </div>
                    <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg">
                        <span class="text-xs text-slate-400">Latency</span>
                        <span id="sb-ping" class="text-xs font-mono text-emerald-400">-- ms</span>
                    </div>
                </div>
            </div>

            <div id="card-fb" class="bg-slate-800 border border-slate-700 rounded-xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition"><i class="fas fa-fire text-6xl text-orange-500"></i></div>
                <div class="flex items-center gap-3 mb-4">
                    <i class="fas fa-server text-orange-400 text-xl"></i>
                    <h2 class="font-bold text-lg">FIREBASE (Backup)</h2>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg">
                        <span class="text-xs text-slate-400">Status</span>
                        <span id="fb-status" class="text-xs font-bold px-2 py-1 rounded bg-slate-700 text-slate-300">CHECKING...</span>
                    </div>
                    <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg">
                        <span class="text-xs text-slate-400">Latency</span>
                        <span id="fb-ping" class="text-xs font-mono text-orange-400">-- ms</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button onclick="checkHealth()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg text-xs font-bold transition shadow-lg shadow-indigo-500/20">
                <i class="fas fa-sync-alt mr-2"></i> REFRESH STATUS
            </button>
            <div class="mt-4">
                <a href="index.html" class="text-[10px] text-slate-500 hover:text-white underline">Kembali ke Dashboard</a>
            </div>
        </div>

    </div>

    <script>
        async function checkHealth() {
            // UI Loading State
            document.getElementById('sb-status').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            document.getElementById('fb-status').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            
            try {
                // Panggil API Health yang baru kita buat
                const res = await fetch('/api/health');
                const data = await res.json();

                // Update SUPABASE UI
                const sbBadge = document.getElementById('sb-status');
                if (data.supabase.status === 'ONLINE') {
                    sbBadge.className = "text-xs font-bold px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                    sbBadge.innerText = "ONLINE";
                    document.getElementById('sb-ping').innerText = data.supabase.ping + " ms";
                    document.getElementById('card-sb').className = "bg-slate-800 border border-emerald-500/50 rounded-xl p-6 relative overflow-hidden group shadow-[0_0_20px_rgba(16,185,129,0.1)]";
                } else {
                    sbBadge.className = "text-xs font-bold px-2 py-1 rounded bg-red-500/20 text-red-400 border border-red-500/30";
                    sbBadge.innerText = "OFFLINE";
                    document.getElementById('card-sb').className = "bg-slate-900 border border-red-900 rounded-xl p-6 relative overflow-hidden opacity-75";
                }

                // Update FIREBASE UI
                const fbBadge = document.getElementById('fb-status');
                if (data.firebase.status === 'ONLINE') {
                    fbBadge.className = "text-xs font-bold px-2 py-1 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30";
                    fbBadge.innerText = "ONLINE";
                    document.getElementById('fb-ping').innerText = data.firebase.ping + " ms";
                    document.getElementById('card-fb').className = "bg-slate-800 border border-orange-500/50 rounded-xl p-6 relative overflow-hidden group shadow-[0_0_20px_rgba(249,115,22,0.1)]";
                } else {
                    fbBadge.className = "text-xs font-bold px-2 py-1 rounded bg-red-500/20 text-red-400 border border-red-500/30";
                    fbBadge.innerText = "OFFLINE";
                    document.getElementById('card-fb').className = "bg-slate-900 border border-red-900 rounded-xl p-6 relative overflow-hidden opacity-75";
                }

            } catch (e) {
                console.error(e);
                document.getElementById('sb-status').innerText = "ERROR";
                document.getElementById('fb-status').innerText = "ERROR";
            }
        }

        // Auto Check pas load
        checkHealth();
        
        // Auto refresh tiap 30 detik
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
