<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal SteVenJr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4a90e2' }
                }
            }
        }
    </script>
    <style>
        .animate-bounce-slow { animation: bounce 3s infinite; }
        /* Biar scrollbar di widget kalo kepanjangan tetep rapi */
        .widget-scroll::-webkit-scrollbar { width: 4px; }
        .widget-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center py-10 relative">

    <div class="absolute top-5 right-5 z-50">
        <a href="admin.html" class="block w-12 h-12 rounded-full bg-gray-200 hover:bg-primary transition shadow-md flex items-center justify-center group overflow-hidden border-2 border-white cursor-pointer" title="Login Admin">
            <i class="fas fa-user text-gray-500 group-hover:text-white text-xl"></i>
        </a>
    </div>

    <div id="main-dashboard" class="w-[95%] max-w-2xl bg-white p-8 rounded-3xl shadow-xl text-center transition-all duration-300 mt-5 border-t-8 border-primary">
        <h1 class="text-3xl font-bold text-primary mb-1 tracking-tight">SteVenJr Schedule</h1>
        <p class="text-gray-400 text-sm mb-6 font-medium">Dashboard Perkuliahan & Aktivitas</p>
        
        <div class="bg-gray-50 rounded-2xl p-5 mb-8 border border-gray-100 shadow-inner">
            <p id="current-date" class="text-gray-500 font-bold uppercase tracking-widest text-xs mb-1">...</p>
            <div id="digital-clock" class="text-6xl font-bold text-gray-800 tracking-tighter">00:00:00</div>
        </div>

        <div class="grid grid-cols-1 gap-3 mb-10">
            <div class="flex gap-3">
                <button id="btn-menu-uts" onclick="switchView('uts')" class="hidden flex-1 bg-gradient-to-r from-orange-400 to-orange-600 text-white py-4 rounded-xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm">
                    <i class="fas fa-file-alt"></i> UTS
                </button>
                <button id="btn-menu-uas" onclick="switchView('uas')" class="hidden flex-1 bg-gradient-to-r from-purple-500 to-indigo-600 text-white py-4 rounded-xl font-bold hover:shadow-lg hover:-translate-y-1 transition items-center justify-center gap-2 text-sm">
                    <i class="fas fa-graduation-cap"></i> UAS
                </button>
            </div>
            
            <button onclick="switchView('daily')" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white py-4 rounded-xl font-bold hover:shadow-lg hover:-translate-y-1 transition flex items-center justify-center gap-3 text-md shadow-blue-100">
                <i class="fas fa-university"></i> Jadwal Kuliah Harian
            </button>
            
            <button onclick="switchView('personal')" class="bg-white text-gray-700 border-2 border-gray-100 py-4 rounded-xl font-bold hover:bg-gray-50 hover:border-green-200 transition flex items-center justify-center gap-3 text-md">
                <i class="fas fa-calendar-check text-green-500"></i> Jadwal Pribadi Saya
            </button>
        </div>

        <div class="border-t pt-6 text-left">
            <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2">
                <i class="fas fa-bell text-yellow-500"></i> Agenda Hari Ini
            </h2>
            <div id="today-schedule-container" class="space-y-4 min-h-[100px] widget-scroll">
                <p class="text-center text-gray-400 text-sm italic">Memuat data...</p>
            </div>
        </div>
    </div>

    <div id="schedule-view" class="hidden w-[98%] max-w-6xl mt-5 animate-fade-in-up pb-20">
        <header class="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b-4 border-blue-500">
            <div>
                <h1 id="page-title" class="text-3xl font-bold text-gray-800">Jadwal</h1>
                <span id="page-category-badge" class="text-xs font-bold px-3 py-1 rounded bg-blue-100 text-blue-600 mt-1 inline-block uppercase">...</span>
            </div>
            
            <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
                <div class="relative flex-grow md:flex-grow-0">
                    <input type="text" id="searchInput" onkeyup="searchSchedule()" placeholder="Cari Mata Kuliah..." class="pl-10 pr-4 py-3 border rounded-xl focus:outline-blue-500 w-full md:w-64 shadow-sm text-sm">
                    <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                </div>

                <button onclick="checkConflictsUI()" class="bg-yellow-100 text-yellow-700 px-5 py-3 rounded-xl font-bold hover:bg-yellow-200 transition flex items-center gap-2 text-sm">
                    <i class="fas fa-exclamation-triangle"></i> Cek Bentrok
                </button>

                <button onclick="location.reload()" class="bg-gray-800 text-white px-6 py-3 rounded-xl font-bold hover:bg-gray-900 transition flex items-center gap-2 text-sm shadow-lg">
                    <i class="fas fa-arrow-left"></i> Kembali
                </button>
            </div>
        </header>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[900px] text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b">
                            <th class="p-5 font-bold">Waktu & Hari</th>
                            <th class="p-5 font-bold">Kegiatan / Matkul</th>
                            <th class="p-5 font-bold">Tempat & Detail</th>
                            <th class="p-5 font-bold">Tipe</th>
                            <th class="p-5 font-bold">Pengajar / Ket</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-table-body" class="divide-y divide-gray-100 text-gray-700 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
        
        <p id="conflict-alert" class="hidden mt-6 px-6 py-4 rounded-xl relative text-center font-bold border-2 text-lg shadow-md transition-all"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js"></script>
    
    <script>
        // LOGIC KHUSUS WIDGET BESAR
        // Ini override fungsi renderWidgetRow di app.js biar tampilan di Index jadi GEDE dan DETAIL
        
        function rowWidget(i, c) {
            // Tentukan Warna Border & Background
            let colors = {
                'orange': 'border-orange-500 bg-orange-50 text-orange-900',
                'purple': 'border-purple-500 bg-purple-50 text-purple-900',
                'blue':   'border-blue-500 bg-blue-50 text-blue-900',
                'green':  'border-green-500 bg-green-50 text-green-900'
            }[c];

            // Detail Logic: Kalau personal ambil 'keterangan', akademik ambil 'dosen' & 'kelas'
            let detailUtama = i.ruangan || 'Online / TBD';
            let detailTambahan = '';

            if (c === 'green') { // Personal
                detailTambahan = i.keterangan || '-';
            } else { // Akademik (UTS/UAS/Daily)
                let kelas = i.kelas ? `(${i.kelas})` : '';
                let dosen = i.dosen ? `• ${i.dosen}` : '';
                detailTambahan = `${kelas} ${dosen}`;
            }

            // HTML WIDGET YANG BARU (LEBIH BESAR & DETAIL)
            return `
            <div class="${colors} border-l-8 p-5 rounded-xl mb-4 shadow-sm hover:shadow-md transition relative overflow-hidden group">
                <div class="flex justify-between items-start">
                    <div class="flex-1 pr-4">
                        <h4 class="font-extrabold text-lg leading-tight mb-2">${i.matkul || i.nama_kegiatan}</h4>
                        
                        <div class="text-sm opacity-80 space-y-1">
                            <p class="flex items-center gap-2 font-semibold">
                                <i class="fas fa-map-marker-alt w-4 text-center"></i> 
                                ${detailUtama}
                            </p>
                            <p class="flex items-center gap-2 text-xs italic">
                                <i class="fas fa-info-circle w-4 text-center"></i> 
                                ${detailTambahan}
                            </p>
                        </div>
                    </div>

                    <div class="flex flex-col items-end">
                        <span class="bg-white/80 backdrop-blur px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm border border-black/5 whitespace-nowrap">
                            ${i.waktu}
                        </span>
                    </div>
                </div>
            </div>`;
        }

        // --- Helper View ---
        function switchView(type) {
            document.getElementById('main-dashboard').style.display = 'none';
            document.getElementById('schedule-view').style.display = 'block';
            window.scrollTo(0,0);
            if(window.loadScheduleData) window.loadScheduleData(type);
        }
        function searchSchedule() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#schedule-table-body tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
