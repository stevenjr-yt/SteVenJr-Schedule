<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SteVenJr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        /* Animasi Tab */
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Style Scrollbar Tipis */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800">

    <div id="login-form" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600">
                    <i class="fas fa-user-shield text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
                <p class="text-gray-400 text-sm">Masuk untuk mengelola jadwal</p>
            </div>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email Address" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition">
                <input type="password" id="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition">
                <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">
                    MASUK DASHBOARD
                </button>
            </div>
            <p id="login-error" class="text-red-500 text-center mt-4 text-sm hidden font-medium"></p>
        </div>
    </div>

    <div id="admin-panel" class="hidden min-h-screen pb-20">
        
        <nav class="bg-white shadow-sm px-6 py-4 mb-8 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl leading-none">Admin Panel</h1>
                        <span class="text-xs text-gray-500">Kelola Jadwal SteVenJr</span>
                    </div>
                </div>
                <div class="flex gap-3">
                    <a href="index.html" target="_blank" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 transition text-sm flex items-center gap-2">
                        <i class="fas fa-external-link-alt"></i> Lihat Web
                    </a>
                    <button id="btn-logout" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-medium hover:bg-red-100 transition text-sm flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-gray-800">Mode UTS/UAS</h3>
                            <p class="text-xs text-gray-500 mt-1">Tampilkan menu UTS di web utama?</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-uts" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                        </label>
                    </div>
                    <div class="mt-2 text-right">
                        <span id="uts-status-text" class="text-xs font-bold uppercase text-purple-600">OFF</span>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-green-500"></i> Tambah Jadwal
                    </h3>
                    
                    <form id="add-schedule-form" class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Kategori</label>
                            <select id="kategori" class="w-full p-3 bg-gray-50 border-none rounded-lg focus:ring-2 focus:ring-blue-500" onchange="toggleFormFields()">
                                <option value="daily">Kuliah Harian</option>
                                <option value="uts">Ujian (UTS/UAS)</option>
                                <option value="personal">Pribadi (Personal)</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Nama Kegiatan / Matkul</label>
                            <input type="text" id="matkul" class="w-full p-3 bg-gray-50 border-none rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Ex: Algoritma" required>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-bold text-gray-500 uppercase">Hari</label>
                                <select id="hari" class="w-full p-3 bg-gray-50 border-none rounded-lg">
                                    <option value="Senin">Senin</option>
                                    <option value="Selasa">Selasa</option>
                                    <option value="Rabu">Rabu</option>
                                    <option value="Kamis">Kamis</option>
                                    <option value="Jumat">Jumat</option>
                                    <option value="Sabtu">Sabtu</option>
                                    <option value="Minggu">Minggu</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-500 uppercase">Waktu</label>
                                <input type="text" id="waktu" placeholder="07:30-10:00" class="w-full p-3 bg-gray-50 border-none rounded-lg">
                            </div>
                        </div>
                        
                        <div id="extra-fields" class="space-y-4 pt-2 border-t border-dashed">
                            <input type="date" id="tanggal" class="w-full p-3 bg-gray-50 border-none rounded-lg text-sm" title="Tanggal (Khusus UTS/Personal)">
                            
                            <div class="grid grid-cols-2 gap-3 field-akademik">
                                <input type="text" id="ruangan" placeholder="Ruang" class="w-full p-3 bg-gray-50 border-none rounded-lg text-sm">
                                <input type="text" id="kode" placeholder="Kode MK" class="w-full p-3 bg-gray-50 border-none rounded-lg text-sm">
                            </div>

                            <div class="field-lecture">
                                <input type="text" id="dosen" placeholder="Nama Dosen" class="w-full p-3 bg-gray-50 border-none rounded-lg text-sm mb-3">
                                <div class="grid grid-cols-2 gap-3">
                                    <select id="tipe" class="w-full p-3 bg-gray-50 border-none rounded-lg text-sm">
                                        <option value="Teori">Teori</option>
                                        <option value="Praktek">Praktek</option>
                                    </select>
                                    <input type="text" id="kelas" placeholder="Kelas" class="w-full p-3 bg-gray-50 border-none rounded-lg text-sm">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg transition">
                            SIMPAN DATA
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800 text-lg">Database Jadwal</h3>
                        <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">Realtime Sync</span>
                    </div>

                    <div class="flex space-x-2 border-b border-gray-200 mb-4 overflow-x-auto pb-1">
                        <button onclick="switchTab('list-daily', this)" class="tab-btn active px-4 py-2 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition whitespace-nowrap">
                            <i class="fas fa-book mr-2"></i>KULIAH HARIAN
                        </button>
                        <button onclick="switchTab('list-uts', this)" class="tab-btn px-4 py-2 text-sm font-bold text-gray-500 hover:text-blue-600 border-b-2 border-transparent hover:border-blue-300 transition whitespace-nowrap">
                            <i class="fas fa-file-alt mr-2"></i>UTS / UAS
                        </button>
                        <button onclick="switchTab('list-personal', this)" class="tab-btn px-4 py-2 text-sm font-bold text-gray-500 hover:text-blue-600 border-b-2 border-transparent hover:border-blue-300 transition whitespace-nowrap">
                            <i class="fas fa-user-clock mr-2"></i>PERSONAL
                        </button>
                    </div>
                    
                    <div class="flex-grow relative min-h-[400px]">
                        <div id="list-daily" class="tab-content active h-full absolute inset-0 overflow-y-auto custom-scroll pr-2 space-y-3">
                            <div class="animate-pulse space-y-3"><div class="h-10 bg-gray-100 rounded"></div><div class="h-10 bg-gray-100 rounded"></div></div>
                        </div>

                        <div id="list-uts" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll pr-2 space-y-3">
                        </div>

                        <div id="list-personal" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll pr-2 space-y-3">
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        // Logic Tampilan Form
        function toggleFormFields() {
            const kategori = document.getElementById('kategori').value;
            const lectureFields = document.querySelectorAll('.field-lecture');
            lectureFields.forEach(el => {
                el.style.display = (kategori === 'personal') ? 'none' : 'block';
            });
        }

        // Logic Pindah Tab Database
        window.switchTab = (targetId, btn) => {
            // Sembunyikan semua konten tab
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Tampilkan konten yang dipilih
            document.getElementById(targetId).classList.add('active');

            // Reset style tombol tab
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn px-4 py-2 text-sm font-bold text-gray-500 hover:text-blue-600 border-b-2 border-transparent hover:border-blue-300 transition whitespace-nowrap";
            });
            // Set style tombol aktif
            btn.className = "tab-btn active px-4 py-2 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition whitespace-nowrap";
        }
    </script>
</body>
</html>
