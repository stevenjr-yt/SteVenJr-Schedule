<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal SteVenJr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#4a90e2' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center py-10 relative">

    <div class="absolute top-5 right-5 z-50">
        <a href="admin.html" class="block w-12 h-12 rounded-full bg-gray-200 hover:bg-primary transition shadow-md flex items-center justify-center group overflow-hidden border-2 border-white cursor-pointer" title="Login Admin">
            <i class="fas fa-user text-gray-500 group-hover:text-white text-xl"></i>
        </a>
    </div>

    <div id="main-dashboard" class="w-[90%] max-w-2xl bg-white p-8 rounded-2xl shadow-xl text-center transition-all duration-300 mt-10">
        <h1 class="text-3xl font-bold text-primary mb-2">SteVenJr Schedule</h1>
        <p class="text-gray-400 text-sm mb-6">Manajemen Waktu & Perkuliahan</p>
        
        <p id="current-date" class="text-gray-500 font-medium">...</p>
        <div id="digital-clock" class="text-6xl font-bold text-gray-800 my-4 tracking-wider">00:00:00</div>

        <div class="grid grid-cols-1 gap-4 mb-8 mt-8">
            <button id="btn-menu-uts" onclick="switchView('uts')" class="hidden bg-gradient-to-r from-red-500 to-pink-600 text-white py-4 rounded-xl font-bold hover:scale-[1.02] transition shadow-lg flex items-center justify-center gap-3">
                <i class="fas fa-file-alt"></i> Cek Jadwal UTS/UAS
            </button>
            
            <button onclick="switchView('daily')" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white py-4 rounded-xl font-bold hover:scale-[1.02] transition shadow-lg flex items-center justify-center gap-3">
                <i class="fas fa-university"></i> Jadwal Kuliah Harian
            </button>
            
            <button onclick="switchView('personal')" class="bg-white text-gray-700 border-2 border-gray-200 py-4 rounded-xl font-bold hover:bg-gray-50 transition shadow-sm flex items-center justify-center gap-3">
                <i class="fas fa-calendar-check text-green-500"></i> Jadwal Pribadi Saya
            </button>
        </div>

        <div class="border-t pt-6 text-left">
            <h2 class="text-lg font-bold mb-3 text-gray-700"><i class="fas fa-bell text-yellow-500 mr-2"></i>Agenda Hari Ini</h2>
            <div id="today-schedule-container" class="space-y-3">
                <p class="text-center text-gray-400 text-sm italic">Memuat data...</p>
            </div>
        </div>
    </div>

    <div id="schedule-view" class="hidden w-[95%] max-w-6xl mt-5 animate-fade-in-up pb-20">
        <header class="bg-white p-6 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 id="page-title" class="text-2xl font-bold text-gray-800">Jadwal</h1>
                <span id="page-category-badge" class="text-xs font-bold px-2 py-1 rounded bg-gray-200 text-gray-600">Kategori</span>
            </div>
            
            <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
                <div class="relative flex-grow md:flex-grow-0">
                    <input type="text" id="searchInput" onkeyup="searchSchedule()" placeholder="Cari Mata Kuliah / Kegiatan..." class="pl-10 pr-4 py-2 border rounded-lg focus:outline-blue-500 w-full md:w-64">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>

                <button onclick="checkConflictsUI()" class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-lg font-bold hover:bg-yellow-200 transition flex items-center gap-2 text-sm">
                    <i class="fas fa-exclamation-triangle"></i> Cek Bentrok
                </button>

                <button onclick="location.reload()" class="bg-gray-800 text-white px-5 py-2 rounded-lg font-bold hover:bg-gray-900 transition flex items-center gap-2 text-sm">
                    <i class="fas fa-arrow-left"></i> Kembali
                </button>
            </div>
        </header>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[800px] text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b">
                            <th class="p-4 font-bold">Waktu & Hari</th>
                            <th class="p-4 font-bold">Kegiatan / Matkul</th>
                            <th class="p-4 font-bold">Detail (Kode/Ruang)</th>
                            <th class="p-4 font-bold">Info Tambahan</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-table-body" class="divide-y divide-gray-100 text-sm text-gray-700">
                        </tbody>
                </table>
            </div>
        </div>
        <p id="conflict-alert" class="hidden mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-center font-bold">
            Ditemukan jadwal yang bentrok! (Lihat baris berwarna merah)
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="app.js"></script>
    <script>
        // Helper kecil buat switch view (biar gak ngerusak logic app.js)
        function switchView(type) {
            document.getElementById('main-dashboard').style.display = 'none';
            document.getElementById('schedule-view').style.display = 'block';
            // Panggil fungsi global dari app.js
            if(window.loadScheduleData) {
                window.loadScheduleData(type);
            }
        }
    </script>
</body>
</html>
