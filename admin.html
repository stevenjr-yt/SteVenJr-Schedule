<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteVenJr OS - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .check-anim:checked + div { text-decoration: line-through; color: #94a3b8; opacity: 0.7; }
        .dashboard-card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="text-gray-800 bg-slate-50">

    <div id="login-form" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border-t-4 border-indigo-600">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">SteVenJr OS</h2>
                <p class="text-xs text-gray-400">Admin Access</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-gray-50 border text-sm text-center focus:outline-none focus:border-indigo-500">
                <input type="password" id="password" placeholder="Passkey" class="w-full px-4 py-3 rounded-xl bg-gray-50 border text-sm text-center focus:outline-none focus:border-indigo-500">
                <button id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">UNLOCK</button>
            </div>
            <p id="login-error" class="text-red-500 text-center mt-4 hidden text-xs font-bold"></p>
        </div>
    </div>

    <div id="admin-panel" class="hidden min-h-screen pb-10">
        <nav class="bg-white px-6 py-4 mb-6 sticky top-0 z-50 border-b border-gray-100 shadow-sm">
            <div class="max-w-[98%] mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fas fa-robot"></i></div>
                    <h1 class="font-bold text-lg text-gray-800">SteVenJr <span class="text-indigo-600">OS</span></h1>
                </div>
                <div class="flex gap-2">
                    <a href="index.html" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2"><i class="fas fa-desktop"></i> Web</a>
                    <button id="btn-logout" class="bg-red-50 text-red-500 hover:bg-red-100 px-4 py-2 rounded-lg text-xs font-bold transition"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </nav>

        <div class="max-w-[98%] mx-auto px-2 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-3 space-y-4">
                <div class="dashboard-card p-5">
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-semibold text-gray-600">Mode UTS</span>
                            <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-uts" class="sr-only peer"><div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-orange-500"></div></label>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-semibold text-gray-600">Mode UAS</span>
                            <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-uas" class="sr-only peer"><div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600"></div></label>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card p-5">
                    <h3 class="font-bold text-xs text-indigo-600 uppercase mb-3 flex items-center gap-2"><i class="fas fa-plus-circle"></i> Input Jadwal</h3>
                    <form id="add-schedule-form" class="space-y-3">
                        <select id="kategori" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs font-bold border border-gray-200 focus:border-indigo-500 outline-none" onchange="toggleFormFields()">
                            <option value="daily">Kuliah Harian</option>
                            <option value="uts">UTS</option>
                            <option value="uas">UAS</option>
                            <option value="personal">Personal</option>
                        </select>

                        <div id="wrapper-frekuensi" class="flex gap-2 p-2 bg-indigo-50 rounded-lg border border-indigo-100">
                            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="frekuensi" value="routine" class="w-3 h-3 accent-indigo-600" checked onchange="toggleFormFields()"><span class="text-[10px] font-bold text-indigo-800">Rutin</span></label>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="frekuensi" value="once" class="w-3 h-3 accent-indigo-600" onchange="toggleFormFields()"><span class="text-[10px] font-bold text-indigo-800">Tgl Spesifik</span></label>
                        </div>

                        <input type="text" id="matkul" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs border border-gray-200" placeholder="Nama Kegiatan..." required>
                        <select id="hari" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs border border-gray-200"><option value="Senin">Senin</option><option value="Selasa">Selasa</option><option value="Rabu">Rabu</option><option value="Kamis">Kamis</option><option value="Jumat">Jumat</option><option value="Sabtu">Sabtu</option><option value="Minggu">Minggu</option></select>
                        <input type="date" id="tanggal" class="w-full p-2.5 bg-yellow-50 rounded-lg text-xs border border-yellow-200 hidden">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="waktu" placeholder="08:00-10:00" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs border border-gray-200" required>
                            <input type="text" id="ruangan" placeholder="Lokasi" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs border border-gray-200">
                        </div>
                        
                        <div id="academic-fields" class="hidden space-y-2 pt-2 border-t border-dashed">
                            <input type="text" id="kode" placeholder="Kode MK" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs">
                            <input type="text" id="dosen" placeholder="Dosen" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs">
                            <div class="grid grid-cols-2 gap-2">
                                <select id="tipe" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs"><option value="Teori">Teori</option><option value="Praktek">Praktek</option></select>
                                <input type="text" id="kelas" placeholder="Kelas" class="w-full p-2.5 bg-gray-50 rounded-lg text-xs">
                            </div>
                        </div>
                        <div id="personal-fields" class="hidden pt-2 border-t border-dashed">
                            <textarea id="keterangan" placeholder="Catatan..." class="w-full p-2.5 bg-gray-50 rounded-lg text-xs" rows="2"></textarea>
                        </div>
                        
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 transition text-xs shadow-md">SIMPAN</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div>
                            <h2 class="text-xl font-bold">Sleep Tracker</h2>
                            <p id="sleep-status-text" class="text-[10px] text-slate-300">Siap beraktivitas!</p>
                        </div>
                        <div class="text-right">
                            <h3 class="text-3xl font-bold text-yellow-400" id="energy-level">100%</h3>
                            <p class="text-[9px] uppercase tracking-widest text-white/50">Energi Tubuh</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-3 relative z-10">
                        <button onclick="toggleSleep(true)" id="btn-sleep" class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl flex flex-col items-center gap-1 transition border border-indigo-500/50">
                            <i class="fas fa-bed text-xl"></i>
                            <span class="text-[10px] font-bold uppercase">Mulai Tidur</span>
                            <span id="sleep-time-display" class="text-[9px] opacity-70">--:--</span>
                        </button>
                        <button onclick="toggleSleep(false)" id="btn-wake" class="bg-orange-500 hover:bg-orange-400 py-3 rounded-xl flex flex-col items-center gap-1 transition border border-orange-400/50 opacity-50 cursor-not-allowed">
                            <i class="fas fa-sun text-xl"></i>
                            <span class="text-[10px] font-bold uppercase">Bangun</span>
                            <span id="wake-time-display" class="text-[9px] opacity-70">--:--</span>
                        </button>
                    </div>
                    <div class="bg-white/10 p-2 rounded-lg text-center relative z-10">
                        <p id="sleep-duration-text" class="text-xs font-medium">Durasi: 0 Jam 0 Menit</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="dashboard-card p-4">
                        <h4 class="font-bold text-gray-800 text-xs mb-3 flex items-center gap-2"><i class="fas fa-ruler-vertical text-blue-500"></i> Body Stats</h4>
                        <div class="space-y-2 mb-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500">Tinggi</span><span class="font-bold">180 cm</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500">Berat</span>
                                <div><input type="number" id="input-bb" value="50" class="w-8 text-right border-b focus:outline-none font-bold" onchange="calculateBMI()"> kg</div>
                            </div>
                        </div>
                        <div id="bmi-result" class="bg-yellow-50 text-yellow-700 text-[9px] font-bold p-1.5 rounded text-center">Loading...</div>
                    </div>
                    <div class="dashboard-card p-4">
                        <h4 class="font-bold text-gray-800 text-xs mb-3 flex items-center gap-2"><i class="fas fa-tint text-cyan-500"></i> Intake</h4>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-gray-600">Makan</span>
                                <div class="flex gap-1">
                                    <input type="checkbox" class="w-4 h-4 accent-green-500 cursor-pointer" id="eat-1" onchange="updateEnergyFromFood()">
                                    <input type="checkbox" class="w-4 h-4 accent-green-500 cursor-pointer" id="eat-2" onchange="updateEnergyFromFood()">
                                    <input type="checkbox" class="w-4 h-4 accent-green-500 cursor-pointer" id="eat-3" onchange="updateEnergyFromFood()">
                                </div>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-gray-600">Minum</span>
                                <div class="flex items-center gap-2">
                                    <button onclick="updateWater(-1)" class="text-gray-400 hover:text-blue-500"><i class="fas fa-minus-circle"></i></button>
                                    <span id="water-count" class="text-sm font-bold text-blue-600">0</span>
                                    <button onclick="updateWater(1)" class="text-gray-400 hover:text-blue-500"><i class="fas fa-plus-circle"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card p-5 h-full">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-gray-800 text-xs flex items-center gap-2"><i class="fas fa-tasks text-gray-400"></i> Misi Hari Ini</h3>
                        <span id="date-today-display" class="text-[9px] bg-gray-100 px-2 py-1 rounded text-gray-500 font-bold">...</span>
                    </div>
                    <div id="daily-checklist-container" class="space-y-2 max-h-[200px] overflow-y-auto custom-scroll pr-1">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="dashboard-card p-0 h-[85vh] flex flex-col sticky top-24 overflow-hidden">
                    <div class="px-4 py-3 bg-slate-50 border-b border-gray-100">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-gray-800 text-xs">Database Jadwal</h3>
                        </div>
                        <div class="flex gap-1 overflow-x-auto pb-1 no-scrollbar">
                            <button onclick="switchTab('list-daily', this)" class="tab-btn active px-3 py-1 text-[10px] font-bold bg-white shadow-sm rounded text-indigo-600 flex-shrink-0 border">Harian</button>
                            <button onclick="switchTab('list-uts', this)" class="tab-btn px-3 py-1 text-[10px] font-bold text-gray-500 hover:bg-gray-100 rounded flex-shrink-0">UTS</button>
                            <button onclick="switchTab('list-uas', this)" class="tab-btn px-3 py-1 text-[10px] font-bold text-gray-500 hover:bg-gray-100 rounded flex-shrink-0">UAS</button>
                            <button onclick="switchTab('list-personal', this)" class="tab-btn px-3 py-1 text-[10px] font-bold text-gray-500 hover:bg-gray-100 rounded flex-shrink-0">Pribadi</button>
                        </div>
                    </div>
                    
                    <div class="px-4 py-2 bg-white border-b border-gray-50">
                         <input type="text" id="db-search" placeholder="Cari data..." class="w-full px-3 py-1.5 bg-gray-50 rounded-lg text-xs border border-gray-100 focus:outline-none">
                    </div>

                    <div class="flex-grow relative bg-white">
                        <div id="list-daily" class="tab-content active h-full absolute inset-0 overflow-y-auto custom-scroll p-3 space-y-2"></div>
                        <div id="list-uts" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll p-3 space-y-2"></div>
                        <div id="list-uas" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll p-3 space-y-2"></div>
                        <div id="list-personal" class="tab-content h-full absolute inset-0 overflow-y-auto custom-scroll p-3 space-y-2"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script> 
    <script src="app.js"></script>
    <script>
        function toggleFormFields() {
            const cat = document.getElementById('kategori').value;
            const academicGroup = document.getElementById('academic-fields');
            const personalGroup = document.getElementById('personal-fields');
            const wrapperFrekuensi = document.getElementById('wrapper-frekuensi');
            const radioRoutine = document.querySelector('input[value="routine"]');
            const hariField = document.getElementById('hari');
            const tanggalField = document.getElementById('tanggal');

            if (cat === 'personal') {
                academicGroup.classList.add('hidden');
                personalGroup.classList.remove('hidden');
            } else {
                academicGroup.classList.remove('hidden');
                personalGroup.classList.add('hidden');
            }

            if (cat === 'uts' || cat === 'uas') {
                wrapperFrekuensi.classList.add('hidden');
                tanggalField.classList.remove('hidden');
                hariField.classList.add('hidden');
            } else {
                wrapperFrekuensi.classList.remove('hidden');
                if (radioRoutine.checked) {
                    hariField.classList.remove('hidden');
                    tanggalField.classList.add('hidden');
                } else {
                    hariField.classList.add('hidden');
                    tanggalField.classList.remove('hidden');
                }
            }
        }
        toggleFormFields();
    </script>
</body>
</html>
